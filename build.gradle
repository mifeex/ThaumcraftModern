plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

def configuredRunDirectory = project.findProperty('runDirectory') ?: 'run'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file(
            'src/main/resources/META-INF/accesstransformer.cfg'
    )

    runs {
        configureEach {
            workingDirectory project.file(configuredRunDirectory)
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            if (!project.hasProperty('skipGameTests')) {
                property 'forge.enabledGameTestNamespaces', mod_id
            }
        }

        server {
            if (!project.hasProperty('skipGameTests')) {
                property 'forge.enabledGameTestNamespaces', mod_id
            }
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

tasks.named('processResources', ProcessResources).configure {
    from('reference/Thaumcraft-4.2-FOREVA-master/src/main/resources/assets/thaumcraft/textures/items') {
        include 'phial.png', 'essence.png'
        into 'assets/thaumcraftmodern/textures/item'
    }
}

tasks.named('processResources', ProcessResources).configure {
    from('reference/Thaumcraft-4.2-FOREVA-master/src/main/resources/assets/thaumcraft/textures/items') {
        include 'elementalpick.png', 'elementalaxe.png', 'elementalsword.png',
                'elementalshovel.png', 'elementalhoe.png', 'bootstraveler.png'
        into 'assets/thaumcraftmodern/textures/item'
    }
    from('reference/Thaumcraft-4.2-FOREVA-master/src/main/resources/assets/thaumcraft/textures/models') {
        include 'bootstraveler.png'
        into 'assets/thaumcraftmodern/textures/models'
    }
    from('reference/Thaumcraft-4.2-FOREVA-master/thaumcraft_src/assets/thaumcraft/sounds') {
        include 'wandfail.ogg', 'wind1.ogg', 'wind2.ogg', 'swing1.ogg', 'swing2.ogg'
        into 'assets/thaumcraftmodern/sounds'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    from('reference/Thaumcraft-4.2-FOREVA-master/src/main/resources/assets/thaumcraft/textures/blocks') {
        include 'urn_*.png', 'crate_*.png'
        into 'assets/thaumcraftmodern/textures/block'
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}-${mod_version}.jar"

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
